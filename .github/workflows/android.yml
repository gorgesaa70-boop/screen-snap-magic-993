# Builds the Android app (unsigned) for Google Play: an .aab for the store and an .apk to try on a phone.
# The native project is generated fresh from capacitor.config.ts each run, so nothing native lives in the repo.
# Signing happens on the owner's computer with the upload key, which never goes to GitHub.
name: android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the store (e.g. 1.0.0)"
        default: "1.0.0"
  push:
    branches: ["android/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      # Store version number: must grow with every upload.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: bun install

      - name: Create the Android project
        run: |
          rm -rf android
          bunx cap add android

      - name: Icons and splash from resources/
        run: |
          mkdir -p assets
          cp resources/icon.png assets/icon-only.png
          cp resources/icon-foreground.png assets/icon-foreground.png
          cp resources/icon-background.png assets/icon-background.png
          # Navy splash with the mark in the middle (ImageMagick is no longer preinstalled on runners)
          sudo apt-get install -y -qq imagemagick >/dev/null
          convert -size 2732x2732 xc:"#02162E" \( resources/splash-icon.png -resize 900x900 \) -gravity center -composite assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          bunx @capacitor/assets@3 generate --android --iconBackgroundColor "#02162E" --iconBackgroundColorDark "#02162E" --splashBackgroundColor "#02162E" --splashBackgroundColorDark "#02162E"

      - name: Arabic app name, version
        run: |
          mkdir -p android/app/src/main/res/values-ar
          cat > android/app/src/main/res/values-ar/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">فاليو عقار</string>
              <string name="title_activity_main">فاليو عقار</string>
          </resources>
          EOF
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName\|targetSdk\|compileSdk" android/app/build.gradle android/variables.gradle

      - run: bunx cap sync android

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/*.aab out/value-aqar-${VERSION_NAME}-${VERSION_CODE}-unsigned.aab
          cp android/app/build/outputs/apk/release/*.apk out/value-aqar-${VERSION_NAME}-${VERSION_CODE}-unsigned.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: out/
